<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel do Administrador</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f4f8; display: flex; justify-content: center; padding: 20px; }
        .app { max-width: 600px; width: 100%; background: white; border-radius: 24px; padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
        h1 { font-size: 24px; color: #0b1a33; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .info-box { background: #4f46e5; color: white; padding: 16px; border-radius: 16px; margin-bottom: 20px; }
        .info-box p { font-size: 14px; opacity: 0.9; }
        .info-box h2 { font-size: 20px; }
        .btn { width: 100%; padding: 16px; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; margin-top: 12px; }
        .btn:hover { opacity: 0.8; }
        .btn-acoes { background: #0b1a33; }
        .btn-relatorio { background: #16a34a; }
        .btn-sair { background: #dc2626; margin-top: 24px; }
        .historico { margin-top: 24px; }
        .historico h3 { margin-bottom: 12px; color: #0b1a33; }
        .card { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #f8fafc; border-radius: 12px; margin-bottom: 8px; border-left: 4px solid #4f46e5; }
        .card .info { flex: 1; }
        .card .info .tipo { font-weight: 600; color: #0b1a33; }
        .card .info .data { font-size: 12px; color: #64748b; }
        .card .aprovacao { display: flex; gap: 8px; margin-top: 8px; }
        .btn-aprovar { background: #16a34a; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .btn-rejeitar { background: #dc2626; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .vazio { text-align: center; color: #94a3b8; padding: 20px; }
    </style>
</head>
<body>
    <div class="app">
        <h1><i class="fas fa-user-tie"></i> Painel do Administrador</h1>

        <div class="info-box">
            <p>Bem-vindo, <strong id="nomeAdmin"></strong>!</p>
            <h2 id="totalPendentes">0</h2>
            <p>Solicitações pendentes</p>
        </div>

        <!-- Gerar Relatório -->
        <button class="btn btn-relatorio" onclick="gerarRelatorio()"><i class="fas fa-file-alt"></i> Gerar Relatório</button>

        <!-- Aprovações -->
        <div class="historico">
            <h3><i class="fas fa-inbox"></i> Solicitações Pendentes</h3>
            <div id="listaSolicitacoes"></div>
        </div>

        <!-- Sair -->
        <button class="btn btn-sair" onclick="sair()"><i class="fas fa-sign-out-alt"></i> Sair</button>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const nome = localStorage.getItem('nome');
        const role = localStorage.getItem('role');

        // Verifica se é admin
        if (!token || role !== 'ADMIN') {
            window.location.href = '/';
        } else {
            document.getElementById('nomeAdmin').textContent = nome;
            carregarSolicitacoes();
        }

        // ===================== APROVAR/REJEITAR =====================
        async function carregarSolicitacoes() {
            try {
                const response = await fetch('/admin/solicitacoes', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const dados = await response.json();

                document.getElementById('totalPendentes').textContent = dados.length;

                const lista = document.getElementById('listaSolicitacoes');
                lista.innerHTML = '';

                if (dados.length === 0) {
                    lista.innerHTML = '<div class="vazio">Nenhuma solicitação pendente.</div>';
                    return;
                }

                dados.forEach(sol => {
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `
                        <div class="info">
                            <div class="tipo">${sol.colaborador.nome}</div>
                            <div class="data">${sol.motivo}</div>
                            <div class="data">Nova hora: ${new Date(sol.novaHora).toLocaleString('pt-BR')}</div>
                            <div class="aprovacao">
                                <button class="btn-aprovar" onclick="aprovar(${sol.id}, 'APROVADO')">Aprovar</button>
                                <button class="btn-rejeitar" onclick="aprovar(${sol.id}, 'REJEITADO')">Rejeitar</button>
                            </div>
                        </div>
                    `;
                    lista.appendChild(div);
                });
            } catch (error) {
                console.error(error);
                document.getElementById('listaSolicitacoes').innerHTML = '<div class="vazio">Erro ao carregar solicitações.</div>';
            }
        }

        async function aprovar(id, status) {
            try {
                const response = await fetch(`/admin/solicitacoes/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ status })
                });
                if (response.ok) {
                    alert(`Solicitação ${status.toLowerCase()} com sucesso!`);
                    carregarSolicitacoes();
                }
            } catch (error) {
                alert('Erro ao processar solicitação');
            }
        }

        // ===================== RELATÓRIO =====================
        async function gerarRelatorio() {
            try {
                const response = await fetch('/admin/relatorio', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const dados = await response.json();

                if (dados.totalHoras !== undefined) {
                    alert(`Total de horas trabalhadas: ${dados.totalHoras.toFixed(2)} horas`);
                } else {
                    alert('Nenhum dado encontrado');
                }
            } catch (error) {
                alert('Erro ao gerar relatório');
            }
        }

        // ===================== SAIR =====================
        function sair() {
            localStorage.clear();
            window.location.href = '/';
        }
    </script>
</body>
</html>
