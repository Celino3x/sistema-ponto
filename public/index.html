<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Ponto</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #0b1a33, #4f46e5); display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 340px; }
        h1 { color: #0b1a33; font-size: 24px; margin-bottom: 24px; text-align: center; }
        input { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; }
        input:focus { border-color: #4f46e5; outline: none; }
        button { width: 100%; padding: 12px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
        button:hover { background: #4338ca; }
        .btn-cadastrar { background: #64748b; margin-top: 10px; }
        .btn-cadastrar:hover { background: #475569; }
        #mensagem { text-align: center; margin-top: 12px; color: #dc2626; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1><i class="fas fa-fingerprint"></i> Login</h1>
        <input type="text" id="usuario" placeholder="Usuário">
        <input type="password" id="senha" placeholder="Senha">
        <button onclick="fazerLogin()">Entrar</button>
        <button class="btn-cadastrar" onclick="cadastrar()">Cadastrar</button>
        <div id="mensagem"></div>
    </div>

    <script>
        // Função de Login
        async function fazerLogin() {
            const usuario = document.getElementById('usuario').value;
            const senha = document.getElementById('senha').value;
            const mensagem = document.getElementById('mensagem');

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('role', data.role);
                    localStorage.setItem('nome', data.nome);
                    
                    if (data.role === 'ADMIN') {
                        window.location.href = '/admin.html';
                    } else {
                        window.location.href = '/colaborador.html';
                    }
                } else {
                    mensagem.textContent = data.error || 'Erro ao fazer login';
                }
            } catch (error) {
                mensagem.textContent = 'Erro de conexão com o servidor';
            }
        }

        // Função para CADASTRAR usuário (Admin ou Colaborador)
        async function cadastrar() {
            // Vamos usar os mesmos campos de usuário e senha, e adicionar dados extras
            const usuario = document.getElementById('usuario').value;
            const senha = document.getElementById('senha').value;
            const mensagem = document.getElementById('mensagem');

            if (!usuario || !senha) {
                mensagem.textContent = '⚠️ Digite um usuário e senha para cadastrar';
                return;
            }

            // Dados que serão enviados (nome, matricula, endereco são obrigatórios no nosso banco)
            const dados = {
                nome: usuario, // Usando o usuário como nome para teste
                matricula: "MAT" + Math.floor(Math.random() * 1000), // Gera uma matrícula aleatória
                endereco: "Endereço de Teste",
                usuario: usuario,
                senha: senha
            };

            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                const data = await response.json();

                if (response.ok) {
                    mensagem.textContent = '✅ Usuário cadastrado! Agora faça o login.';
                    mensagem.style.color = 'green';
                } else {
                    mensagem.textContent = data.error || 'Erro ao cadastrar';
                    mensagem.style.color = 'red';
                }
            } catch (error) {
                mensagem.textContent = 'Erro de conexão com o servidor';
                mensagem.style.color = 'red';
            }
        }
    </script>
</body>
</html>
